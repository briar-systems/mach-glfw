name: Release

# the family release pipeline (briar-systems/.github mach-release.yml). a pushed
# v* tag is checked against mach.toml and the changelog, runs the full CI tier,
# and is published with its changelog section as notes. a dispatch rehearses
# the same path under a throwaway tag and deletes the draft. no binary assets.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: briar-systems/.github/.github/workflows/mach-release.yml@main
    with:
      stage: verify

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      heavy: all

  publish:
    needs: [verify, ci]
    uses: briar-systems/.github/.github/workflows/mach-release.yml@main
    permissions:
      contents: write
    with:
      stage: publish
