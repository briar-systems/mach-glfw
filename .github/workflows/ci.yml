name: CI

# the family's tiered pipeline (briar-systems/.github mach-lib.yml). a pull
# request into dev runs the linux leg, a pull request into main runs every leg
# and the system-glfw job. the per-leg checks live in .github/ci. nothing runs
# on push. cd.yml calls this with heavy: all, since a tag has no base.

on:
  pull_request:
  workflow_call:
    inputs:
      heavy:
        type: string
        default: none
  workflow_dispatch:
    inputs:
      heavy:
        description: heavy work to run on this ref
        type: choice
        default: none
        options: [none, all, windows-cross, x86_64-windows, x86_64-darwin, darwin-system]

permissions:
  contents: read

jobs:
  # every leg builds the demo, its own project under demo/window, against the
  # vendored static archive. the linux leg also checks the generated surface and
  # runs the demo under xvfb, the windows-cross leg inspects the PE imports, and
  # the native legs run the demo.
  lib:
    uses: briar-systems/.github/.github/workflows/mach-lib.yml@main
    with:
      heavy: ${{ inputs.heavy }}
      # glfw needs mach 5.12, so it seeds v5.12.0 until the family pin moves (briar-systems/.github#103)
      mach-version: v5.12.0
      # each target needs its own toolchain, so the legs below cover them
      all-targets: false
      # the demo is its own project, so every profile builds it on every leg and
      # verify.sh checks and runs it
      subprojects: >-
        [{"path": "demo/window", "build": true, "test": false}]
      legs: >-
        [{"name": "x86_64-linux", "runs-on": "ubuntu-latest", "target": "linux-x86_64",
          "apt": ["llvm", "xauth", "xorg-dev", "xvfb", "libwayland-bin", "libwayland-dev",
                  "libxkbcommon-dev", "wayland-protocols"]},
         {"name": "windows-cross", "runs-on": "ubuntu-latest", "tier": "heavy",
          "target": "windows", "test": false, "apt": ["llvm", "xz-utils"]},
         {"name": "x86_64-windows", "runs-on": "windows-latest", "tier": "heavy",
          "target": "windows", "test": false},
         {"name": "x86_64-darwin", "runs-on": "macos-15-intel", "tier": "heavy",
          "target": "darwin", "test": false, "build-args": ["--pie"]}]

  # the opt-in system-glfw link, which rewrites the library manifest, so it
  # cannot share a leg with the vendored build. the demo's path dependency is a
  # copy, so the swap lands before the demo pulls it
  darwin-system:
    if: github.base_ref == 'main' || inputs.heavy == 'all' || inputs.heavy == 'darwin-system'
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: briar-systems/.github/.github/actions/seed-mach@main
        with:
          tag: v5.12.0
      - name: build and run against the system GLFW
        run: |
          set -euo pipefail
          brew install glfw
          tools/system-glfw.sh
          mach dep pull demo/window
          prefix=$(brew --prefix glfw)
          mach build demo/window --target darwin --profile debug --pie -L "$prefix/lib"
          mach build demo/window --target darwin --profile release --pie -L "$prefix/lib"
          for profile in debug release; do
            exe="demo/window/out/darwin/$profile/bin/window"
            otool -L "$exe" | grep -E 'libglfw(\.3)?\.dylib'
            "$exe" --smoke | tee "$RUNNER_TEMP/glfw-system-$profile.log"
            version=$(sed -n 's/^GLFW //p' "$RUNNER_TEMP/glfw-system-$profile.log")
            major=${version%%.*}
            remainder=${version#*.}
            minor=${remainder%%.*}
            if [[ ! $major =~ ^[0-9]+$ || ! $minor =~ ^[0-9]+$ ]] ||
               (( major < 3 || (major == 3 && minor < 4) )); then
              echo "::error::system GLFW $version is older than 3.4"
              exit 1
            fi
            grep -q '^smoke ok$' "$RUNNER_TEMP/glfw-system-$profile.log"
          done

  gate:
    if: always()
    needs: [lib, darwin-system]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
