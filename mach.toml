[project]
id = "glfw"
version = "0.11.2"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
env  = "gnu"
abi  = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys  = "linux"
env  = "gnu"
abi  = "aapcs64"

[target.windows]
arch = "x86_64"
sys  = "windows"
abi  = "win64"

[target.darwin]
arch = "x86_64"
sys  = "darwin"
abi  = "sysv64"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.glfw]
kind = "static"
entry = "lib/glfw.mach"
out = "{project.work}/lib/glfw{artifact.suffix}"
targets = ["*"]
# mach tests an artifact's closure with that artifact's links, so the library
# names everything the vendored archive needs for `mach test .` to link
link = [
    "glfw", "glfw-win",
    "mingw32", "compiler-rt",
    "c", "pthread", "m", "dl", "rt",
    "gdi32", "user32", "shell32", "kernel32",
    "ucrt-heap", "ucrt-string", "ucrt-convert", "ucrt-utility",
    "ucrt-math", "ucrt-private", "ucrt-stdio",
    "libsystem", "objc",
    "Cocoa", "AppKit", "Foundation", "CoreGraphics", "CoreServices",
    "IOKit", "CoreFoundation", "CoreVideo", "OpenGL",
]
need = []
default = true
export = true

# the vendored archive. glfw.c attributes every import to "glfw", or to "glfw-win"
# on windows, so these keys stay the library's identity whichever GLFW provides
# it. the opt-in tools/system-glfw.sh rewrites both entries to a system-installed
# GLFW (glfw, glfw3.dll) under the same keys
[link.glfw]
source = "local"
path = "{project.work}/vendor/glfw/libglfw.a"
sys = ["linux", "darwin"]
arch = ["*"]
abi = ["*"]
export = true

[link.glfw-win]
source = "local"
path = "{project.work}/vendor/glfw/libglfw.a"
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

# zig's mingw wrappers supply C functions that UCRT does not export directly;
# compiler-rt supplies the compiler builtins used by the archive
[link.mingw32]
source = "local"
path = "{project.work}/vendor/mingw/libmingw32.lib"
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

[link.compiler-rt]
source = "local"
path = "{project.work}/vendor/mingw/compiler_rt.lib"
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

# the static archive needs these itself; a system libglfw.so resolved them
# transitively. the link reaches no symbol through a library's own needs, so libc
# is named too. X11/wayland/GL are dlopen'd at runtime, so they are not linked.
[link.c]
source = "system"
name = "c"
sys = ["linux"]
arch = ["*"]
abi = ["*"]
export = true

[link.pthread]
source = "system"
name = "pthread"
sys = ["linux"]
arch = ["*"]
abi = ["*"]
export = true

[link.m]
source = "system"
name = "m"
sys = ["linux"]
arch = ["*"]
abi = ["*"]
export = true

[link.dl]
source = "system"
name = "dl"
sys = ["linux"]
arch = ["*"]
abi = ["*"]
export = true

[link.rt]
source = "system"
name = "rt"
sys = ["linux"]
arch = ["*"]
abi = ["*"]
export = true

# the four DLLs GLFW's win32 backend imports directly
[link.gdi32]
source = "system"
name = "gdi32.dll"
symbols = [
    "ChoosePixelFormat", "CreateBitmap", "CreateDCW", "CreateDIBSection",
    "CreateRectRgn", "DeleteDC", "DeleteObject", "DescribePixelFormat",
    "GetDeviceCaps", "GetDeviceGammaRamp", "SetDeviceGammaRamp",
    "SetPixelFormat", "SwapBuffers",
]
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

[link.user32]
source = "system"
name = "user32.dll"
symbols = [
    "AdjustWindowRectEx", "BringWindowToTop", "ChangeDisplaySettingsExW",
    "ClientToScreen", "ClipCursor", "CloseClipboard", "CreateIconIndirect",
    "CreateWindowExW", "DefWindowProcW", "DestroyIcon", "DestroyWindow",
    "DispatchMessageW", "EmptyClipboard", "EnumDisplayDevicesW",
    "EnumDisplayMonitors", "EnumDisplaySettingsExW", "EnumDisplaySettingsW",
    "FlashWindow", "GetActiveWindow", "GetClassLongPtrW", "GetClientRect",
    "GetClipboardData", "GetCursorPos", "GetDC", "GetKeyState",
    "GetLayeredWindowAttributes", "GetMessageTime", "GetMonitorInfoW",
    "GetPropW", "GetRawInputData", "GetRawInputDeviceInfoA",
    "GetRawInputDeviceList", "GetSystemMetrics", "GetWindowLongW",
    "GetWindowPlacement", "GetWindowRect", "IsIconic", "IsWindowVisible",
    "IsZoomed", "LoadCursorW", "LoadImageW", "MapVirtualKeyW",
    "MonitorFromWindow", "MoveWindow", "MsgWaitForMultipleObjects",
    "OffsetRect", "OpenClipboard", "PeekMessageW", "PostMessageW",
    "PtInRect", "RegisterClassExW", "RegisterDeviceNotificationW",
    "RegisterRawInputDevices", "ReleaseCapture", "ReleaseDC", "RemovePropW",
    "ScreenToClient", "SendMessageW", "SetCapture", "SetClipboardData",
    "SetCursor", "SetCursorPos", "SetFocus", "SetForegroundWindow",
    "SetLayeredWindowAttributes", "SetPropW", "SetRect", "SetWindowLongW",
    "SetWindowPlacement", "SetWindowPos", "SetWindowTextW", "ShowWindow",
    "SystemParametersInfoW", "ToUnicode", "TrackMouseEvent",
    "TranslateMessage", "UnregisterClassW", "UnregisterDeviceNotification",
    "WaitMessage", "WindowFromPoint",
]
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

[link.shell32]
source = "system"
name = "shell32.dll"
symbols = ["DragAcceptFiles", "DragFinish", "DragQueryFileW", "DragQueryPoint"]
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

[link.kernel32]
source = "system"
name = "kernel32.dll"
symbols = [
    "DeleteCriticalSection", "EnterCriticalSection", "FormatMessageW",
    "FreeLibrary", "GetLastError", "GetModuleHandleExW", "GetModuleHandleW",
    "GetProcAddress", "GetStartupInfoW", "GlobalAlloc", "GlobalFree",
    "GlobalLock", "GlobalUnlock", "InitializeCriticalSection",
    "LeaveCriticalSection", "LoadLibraryA", "MultiByteToWideChar",
    "QueryPerformanceCounter", "QueryPerformanceFrequency",
    "SetThreadExecutionState", "Sleep", "TlsAlloc", "TlsFree",
    "TlsGetValue", "TlsSetValue", "VerSetConditionMask",
    "WideCharToMultiByte",
]
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

# the dynamic half of GLFW's C runtime surface. the remaining memcpy, memmove,
# memset, strlen, sprintf, sscanf and vsnprintf need the static mingw CRT.
[link.ucrt-heap]
source = "system"
name = "api-ms-win-crt-heap-l1-1-0.dll"
symbols = ["malloc", "free", "realloc"]
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

[link.ucrt-string]
source = "system"
name = "api-ms-win-crt-string-l1-1-0.dll"
symbols = [
    "strcmp", "strcpy", "strcspn", "strncmp", "strncpy",
    "strspn", "strtok", "wcscmp", "wcscpy", "wcslen",
]
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

[link.ucrt-convert]
source = "system"
name = "api-ms-win-crt-convert-l1-1-0.dll"
symbols = ["strtol", "strtoul"]
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

[link.ucrt-utility]
source = "system"
name = "api-ms-win-crt-utility-l1-1-0.dll"
symbols = ["qsort"]
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

[link.ucrt-math]
source = "system"
name = "api-ms-win-crt-math-l1-1-0.dll"
symbols = ["powf"]
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

[link.ucrt-private]
source = "system"
name = "api-ms-win-crt-private-l1-1-0.dll"
symbols = ["strstr"]
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

[link.ucrt-stdio]
source = "system"
name = "api-ms-win-crt-stdio-l1-1-0.dll"
symbols = ["__stdio_common_vsprintf", "__stdio_common_vsscanf"]
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = true

# the logical name matches std's, so a symbol both claim names one provider
[link.libsystem]
source = "system"
name = "/usr/lib/libSystem.B.dylib"
symbols = [
    "__assert_rtn", "__bzero", "__memcpy_chk", "__sprintf_chk",
    "__stack_chk_fail", "__stack_chk_guard", "_NSConcreteGlobalBlock",
    "_NSGetProgname", "chdir", "dlclose", "dlopen", "dlsym", "fmod",
    "free", "mach_absolute_time", "mach_timebase_info", "malloc",
    "memcpy", "memmove", "memset", "powf", "pthread_getspecific",
    "pthread_key_create", "pthread_key_delete", "pthread_mutex_destroy",
    "pthread_mutex_init", "pthread_mutex_lock", "pthread_mutex_unlock",
    "pthread_setspecific", "qsort", "realloc", "sprintf", "sscanf",
    "strcmp", "strcpy", "strcspn", "strlen", "strncmp", "strncpy",
    "strspn", "strstr", "strtok", "strtol", "strtoul", "usleep",
    "vsnprintf",
]
sys = ["darwin"]
arch = ["*"]
abi = ["*"]
export = true

[link.objc]
