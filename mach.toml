[step.build-glfw]
argv = ["bash", "tools/build-glfw.sh", "{project.work}/vendor/glfw"]
in = [
    "tools/build-glfw.sh",
    "vendor/glfw/include/GLFW/*",
    "vendor/glfw/src/*",
    "vendor/glfw/deps/wayland/*",
]
out = ["{project.work}/vendor/glfw/libglfw.a"]
need = []

[step.mingw-runtime]
argv = ["bash", "tools/materialize-mingw-runtime.sh", "{project.work}/vendor/mingw/libmingw32.lib", "{project.work}/vendor/mingw/compiler_rt.lib"]
in = ["tools/materialize-mingw-runtime.sh"]
out = [
    "{project.work}/vendor/mingw/libmingw32.lib",
    "{project.work}/vendor/mingw/compiler_rt.lib",
]
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"
